<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About | Valinor</title>
  <meta name="description" content="About Valinor" />
  <!-- Source Serif 4 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --text:#0b1220;
      --muted:#3f4a5a;
      --line:#e6e8ee;
      --max:1100px;
    }
    *{box-sizing:border-box}
    html{overflow-y:scroll}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
    /* Header */
    header{
      padding:34px 0 18px;
      border-bottom:1px solid var(--line);
    }
    .head{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .logo{
      display:block;
      height:56px;
      width:auto;
      max-width:min(420px, 90vw);
      object-fit:contain;
    }
    nav{
      display:flex;
      gap:22px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      font-size:13px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    nav a{padding:10px 6px;color:var(--text)}
    /* Page */
    main{padding:44px 0 52px}
    .section{padding:32px 0}
    .section + .section{border-top:1px solid var(--line)}
    .eyebrow{
      margin:0 0 18px;
      font-size:13px;
      letter-spacing:.28em;
      text-transform:uppercase;
      font-weight:600;
      text-align:center;
    }
    .copy{
      margin:0 auto;
      max-width:900px;
      color:var(--muted);
      font-size:14px;
      line-height:1.95;
      text-align:center;
    }
    /* LOGO GRID BASE */
    .logo-grid{
      margin-top:30px;
      display:grid;
      align-items:center;
      justify-items:center;
    }
    .logo-item{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    /* Select Clients — UPDATED SPACING */
    #clientsGrid{
      grid-template-columns:repeat(3, auto);
      column-gap:60px;   /* ← Increased horizontal spacing */
      row-gap:24px;
      justify-content:center;
    }
    #clientsGrid img{
      max-height:68px;
      width:auto;
      height:auto;
      object-fit:contain;
    }
    /* Previous Experience */
    #experienceGrid .logo-item{
      padding:0;
    }
    footer{
